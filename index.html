<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Palettive — Color Palette Generator</title>
    <script>(function(){try{var d='dark';var t=localStorage.getItem('palettive-dark')==='true'||(!localStorage.getItem('palettive-dark')&&window.matchMedia('(prefers-color-scheme:dark)').matches);if(t)document.documentElement.classList.add(d)}catch(e){}})()</script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
